name: Türkçe modül doğrulaması
on: [push, pull_request]
permissions:
  contents: read
jobs:
  denetim:
    defaults:
      run:
        working-directory: combined-movement-reasoning
    strategy:
      matrix:
        isletim: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.isletim }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Davranış ve HTTP sözleşmesi testleri
        run: python -m unittest discover -s testler -v
      - name: Paket oluşturma
        run: python -m pip wheel . --no-deps --wheel-dir dist
  movement-budget-solver:
    defaults:
      run:
        working-directory: movement-budget-solver
    strategy:
      matrix:
        isletim: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.isletim }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Hareket bütçesi testleri
        run: python -m unittest discover -s testler -v
      - name: Hareket bütçesi paketi
        run: python -m pip wheel . --no-deps --wheel-dir dist
